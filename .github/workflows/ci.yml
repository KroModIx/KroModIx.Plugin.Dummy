name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore (GitHub Packages)
        # NuGet-Package Kroste.ModManager.PluginContracts kommt von GitHub Packages.
        # Für Read-Access reicht das default GITHUB_TOKEN.
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source \
            "https://nuget.pkg.github.com/Kroste/index.json" \
            --name kroste-github \
            --username github-actions \
            --password "${NUGET_AUTH_TOKEN}" \
            --store-password-in-clear-text
          dotnet restore

      - run: dotnet build --no-restore -c Release
